<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Stats page</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
body{margin:0;background:#f4f3ee;color:#22251f;font-family:"IBM Plex Sans",system-ui,sans-serif;font-size:14px}
a{color:#2f6f5e}a:hover{color:#1f4f43}
</style>
</helmet>

<div style="max-width: 1280px; margin: 0 auto; box-sizing: border-box; padding: 24px; display: flex; flex-direction: column; gap: 20px">

  <header style="display: flex; align-items: center; justify-content: space-between; gap: 12px">
    <div style="font-size: 20px; font-weight: 600">Lyubishchev</div>
    <nav style="display: flex; gap: 8px">
      <a href="Main.dc.html" style="padding: 8px 14px; border-radius: 6px; color: #22251f; text-decoration: none">Log</a>
      <a href="Stats.dc.html" style="padding: 8px 14px; border-radius: 6px; background: #22251f; color: #ffffff; text-decoration: none; font-weight: 500">Stats</a>
    </nav>
  </header>

  <div style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px">
    <div style="display: flex; gap: 4px; padding: 4px; border-radius: 8px; background: #e9e8e1">
      <a href="#time" style="padding: 8px 16px; border-radius: 6px; background: #ffffff; color: #22251f; text-decoration: none; font-weight: 500">Time stat</a>
      <a href="#habits" style="padding: 8px 16px; border-radius: 6px; color: #4a4e45; text-decoration: none">Habits</a>
    </div>
    <div style="display: flex; align-items: center; gap: 16px">
      <div style="display: flex; gap: 2px; font-size: 13px">
        <a href="#daily" style="padding: 6px 12px; border-radius: 6px; color: #4a4e45; text-decoration: none">Daily</a>
        <a href="#weekly" style="padding: 6px 12px; border-radius: 6px; color: #22251f; text-decoration: none; font-weight: 600; border-bottom: 2px solid #22251f">Weekly</a>
        <a href="#month" style="padding: 6px 12px; border-radius: 6px; color: #4a4e45; text-decoration: none">Month</a>
      </div>
      <div style="font-size: 13px; color: #6b6f63; font-family: 'IBM Plex Mono', monospace">2 Nov – 8 Nov 2026</div>
    </div>
  </div>

  <div style="display: flex; flex-wrap: wrap; gap: 20px">

    <section style="flex: 1 1 360px; min-width: 0; display: flex; flex-direction: column; gap: 12px; padding: 16px; border-radius: 8px; background: #ffffff">
      <h2 style="margin: 0; font-size: 15px; font-weight: 600">Share of the week</h2>
      <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 20px">
        <div style="width: 200px; height: 200px; border-radius: 50%; background: conic-gradient(#2f6f5e 0 38%, #4f8fbf 38% 58%, #b8862b 58% 76%, #7a5fa6 76% 82%, #c0554d 82% 90%, #d9d8cf 90% 100%)" role="img" aria-label="Pie: work 38%, self improving 20%, routine 18%, exercise and calm 6%, regret 8%, other 10%"></div>
        <div style="display: grid; grid-template-columns: 12px 1fr auto; gap: 8px 10px; align-items: center; font-size: 13px; min-width: 0">
          <span style="width: 12px; height: 12px; border-radius: 2px; background: #2f6f5e"></span><span>work</span><span style="font-family: 'IBM Plex Mono', monospace">31 h · 38%</span>
          <span style="width: 12px; height: 12px; border-radius: 2px; background: #4f8fbf"></span><span>self improving</span><span style="font-family: 'IBM Plex Mono', monospace">16 h · 20%</span>
          <span style="width: 12px; height: 12px; border-radius: 2px; background: #b8862b"></span><span>routine</span><span style="font-family: 'IBM Plex Mono', monospace">15 h · 18%</span>
          <span style="width: 12px; height: 12px; border-radius: 2px; background: #7a5fa6"></span><span>exercise + calm</span><span style="font-family: 'IBM Plex Mono', monospace">5 h · 6%</span>
          <span style="width: 12px; height: 12px; border-radius: 2px; background: #c0554d"></span><span>regret</span><span style="font-family: 'IBM Plex Mono', monospace">6 h · 8%</span>
          <span style="width: 12px; height: 12px; border-radius: 2px; background: #d9d8cf"></span><span>other</span><span style="font-family: 'IBM Plex Mono', monospace">8 h · 10%</span>
        </div>
      </div>
    </section>

    <section style="flex: 1 1 360px; min-width: 0; display: flex; flex-direction: column; gap: 12px; padding: 16px; border-radius: 8px; background: #ffffff">
      <h2 style="margin: 0; font-size: 15px; font-weight: 600">Sleep per night</h2>
      <svg viewBox="0 0 420 200" style="width: 100%; height: auto; max-width: 100%" role="img" aria-label="Line: sleep hours per night, 7 nights, between 6 and 8 hours">
        <line x1="40" y1="20" x2="40" y2="170" stroke="#c9cbc2" stroke-width="1"></line>
        <line x1="40" y1="170" x2="410" y2="170" stroke="#c9cbc2" stroke-width="1"></line>
        <line x1="40" y1="60" x2="410" y2="60" stroke="#ecebe4" stroke-width="1"></line>
        <line x1="40" y1="115" x2="410" y2="115" stroke="#ecebe4" stroke-width="1"></line>
        <text x="32" y="64" font-size="11" fill="#6b6f63" text-anchor="end" font-family="IBM Plex Mono, monospace">8h</text>
        <text x="32" y="119" font-size="11" fill="#6b6f63" text-anchor="end" font-family="IBM Plex Mono, monospace">7h</text>
        <text x="32" y="174" font-size="11" fill="#6b6f63" text-anchor="end" font-family="IBM Plex Mono, monospace">6h</text>
        <polyline points="60,110 115,135 170,70 225,150 280,100 335,55 390,120" fill="none" stroke="#4f8fbf" stroke-width="2.5" stroke-linejoin="round"></polyline>
        <circle cx="60" cy="110" r="3.5" fill="#4f8fbf"></circle><circle cx="115" cy="135" r="3.5" fill="#4f8fbf"></circle><circle cx="170" cy="70" r="3.5" fill="#4f8fbf"></circle><circle cx="225" cy="150" r="3.5" fill="#4f8fbf"></circle><circle cx="280" cy="100" r="3.5" fill="#4f8fbf"></circle><circle cx="335" cy="55" r="3.5" fill="#4f8fbf"></circle><circle cx="390" cy="120" r="3.5" fill="#4f8fbf"></circle>
        <text x="60" y="190" font-size="11" fill="#6b6f63" text-anchor="middle" font-family="IBM Plex Sans, sans-serif">Mon</text>
        <text x="115" y="190" font-size="11" fill="#6b6f63" text-anchor="middle" font-family="IBM Plex Sans, sans-serif">Tue</text>
        <text x="170" y="190" font-size="11" fill="#6b6f63" text-anchor="middle" font-family="IBM Plex Sans, sans-serif">Wed</text>
        <text x="225" y="190" font-size="11" fill="#6b6f63" text-anchor="middle" font-family="IBM Plex Sans, sans-serif">Thu</text>
        <text x="280" y="190" font-size="11" fill="#6b6f63" text-anchor="middle" font-family="IBM Plex Sans, sans-serif">Fri</text>
        <text x="335" y="190" font-size="11" fill="#6b6f63" text-anchor="middle" font-family="IBM Plex Sans, sans-serif">Sat</text>
        <text x="390" y="190" font-size="11" fill="#6b6f63" text-anchor="middle" font-family="IBM Plex Sans, sans-serif">Sun</text>
      </svg>
    </section>

  </div>

  <section style="display: flex; flex-direction: column; gap: 12px; padding: 16px; border-radius: 8px; background: #ffffff">
    <h2 style="margin: 0; font-size: 15px; font-weight: 600">Hours per day</h2>
    <div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 16px; align-items: end; height: 200px">
      <div style="display: flex; flex-direction: column-reverse; height: 100%; justify-content: flex-start"><div style="height: 78px; background: #2f6f5e"></div><div style="height: 30px; background: #4f8fbf"></div><div style="height: 40px; background: #b8862b"></div><div style="height: 16px; background: #7a5fa6"></div><div style="height: 8px; background: #c0554d"></div><div style="height: 12px; background: #d9d8cf"></div></div>
      <div style="display: flex; flex-direction: column-reverse; height: 100%; justify-content: flex-start"><div style="height: 70px; background: #2f6f5e"></div><div style="height: 12px; background: #4f8fbf"></div><div style="height: 36px; background: #b8862b"></div><div style="height: 10px; background: #7a5fa6"></div><div style="height: 20px; background: #c0554d"></div><div style="height: 44px; background: #d9d8cf"></div></div>
      <div style="display: flex; flex-direction: column-reverse; height: 100%; justify-content: flex-start"><div style="height: 90px; background: #2f6f5e"></div><div style="height: 34px; background: #4f8fbf"></div><div style="height: 42px; background: #b8862b"></div><div style="height: 18px; background: #7a5fa6"></div><div style="height: 4px; background: #c0554d"></div><div style="height: 0px; background: #d9d8cf"></div></div>
      <div style="display: flex; flex-direction: column-reverse; height: 100%; justify-content: flex-start"><div style="height: 50px; background: #2f6f5e"></div><div style="height: 10px; background: #4f8fbf"></div><div style="height: 30px; background: #b8862b"></div><div style="height: 6px; background: #7a5fa6"></div><div style="height: 14px; background: #c0554d"></div><div style="height: 80px; background: #d9d8cf"></div></div>
      <div style="display: flex; flex-direction: column-reverse; height: 100%; justify-content: flex-start"><div style="height: 74px; background: #2f6f5e"></div><div style="height: 26px; background: #4f8fbf"></div><div style="height: 38px; background: #b8862b"></div><div style="height: 14px; background: #7a5fa6"></div><div style="height: 10px; background: #c0554d"></div><div style="height: 22px; background: #d9d8cf"></div></div>
      <div style="display: flex; flex-direction: column-reverse; height: 100%; justify-content: flex-start"><div style="height: 10px; background: #2f6f5e"></div><div style="height: 56px; background: #4f8fbf"></div><div style="height: 50px; background: #b8862b"></div><div style="height: 40px; background: #7a5fa6"></div><div style="height: 18px; background: #c0554d"></div><div style="height: 10px; background: #d9d8cf"></div></div>
      <div style="display: flex; flex-direction: column-reverse; height: 100%; justify-content: flex-start"><div style="height: 0px; background: #2f6f5e"></div><div style="height: 30px; background: #4f8fbf"></div><div style="height: 24px; background: #b8862b"></div><div style="height: 20px; background: #7a5fa6"></div><div style="height: 0px; background: #c0554d"></div><div style="height: 30px; background: #d9d8cf"></div></div>
    </div>
    <div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 16px; font-size: 12px; color: #6b6f63; text-align: center">
      <div>Mon</div><div>Tue</div><div>Wed</div><div>Thu</div><div>Fri</div><div>Sat</div><div>Sun</div>
    </div>
  </section>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":860}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
