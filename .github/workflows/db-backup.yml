name: DB Backup

on:
  schedule:
    # 17:00 UTC = 03:00 Sydney (AEST, UTC+10); 04:00 during daylight saving (AEDT).
    - cron: '0 17 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install PostgreSQL 18 client (pgdg)
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-18
          pg_dump --version

      - name: Run encrypted backup
        env:
          LYUBISHCHEV_DATABASE_URL: ${{ secrets.LYUBISHCHEV_DATABASE_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          echo "ARTIFACT_DATE=$(date -u +%Y%m%d)" >> "$GITHUB_ENV"
          ./scripts/db_backup.sh "lyubishchev-$(date -u +%Y%m%d).sql.gz.gpg"

      - name: Upload encrypted backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: db-backup-${{ env.ARTIFACT_DATE }}
          path: lyubishchev-*.sql.gz.gpg
          retention-days: 90
          if-no-files-found: error
